name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  plugins:
    name: Build and test agent plugins
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix integrations/agent
      - run: npm run build
      - run: npm run build:plugins
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:plugins
      - run: npm run build:standalone
      - run: npm run test:standalone
      - name: Pack release downloads with the publishing npm
        run: npm exec --yes --package=npm@latest -- node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-plugins-${{ matrix.os }}
          path: |
            dist/plugins
            dist/mcp
          include-hidden-files: true
  test:
    needs: plugins
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: agent-plugins-ubuntu-latest
          path: dist
      - name: The packed tarball installs and runs
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/jakerains-scormplayer-*.tgz
          scormplayer --version
          scormplayer --help | head -3

  browser:
    name: ${{ matrix.os }} · ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Start audio output for Linux narration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=scormplayer_ci
          pactl set-default-sink scormplayer_ci
      - run: npm run test:e2e
        env:
          SCORMPLAYER_BROWSER: ${{ matrix.browser }}
