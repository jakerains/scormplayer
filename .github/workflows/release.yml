name: Release

# Push a tag like v0.2.0 (matching package.json's version) to publish to npm.
# Publishing uses npm trusted publishing: no token is stored. Configure it once on
# npmjs.com → @jakerains/scormplayer → Settings → Trusted publishing → GitHub Actions,
# with this repository and the workflow file name release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

# One release per tag at a time; a duplicate trigger waits and then finds the version published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish (skipped when this version is already on npm)
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@jakerains/scormplayer@$version" version >/dev/null 2>&1; then
            echo "@jakerains/scormplayer@$version is already published; nothing to do."
          else
            npm publish --access public
          fi
