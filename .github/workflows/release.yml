name: Release

# Push a tag like v0.2.0 (matching package.json's version) to publish to npm.
# Publishing uses npm trusted publishing: no token is stored. Configure it once on
# npmjs.com → @jakerains/scormplayer → Settings → Trusted publishing → GitHub Actions,
# with this repository and the workflow file name release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

# One release per tag at a time; a duplicate trigger waits and then finds the version published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm ci --prefix integrations/agent
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run build:plugins
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:plugins
      - run: npm run build:standalone
      - run: npm run test:standalone
      - name: Publish (skipped when this version is already on npm)
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@jakerains/scormplayer@$version" version >/dev/null 2>&1; then
            echo "@jakerains/scormplayer@$version is already published; nothing to do."
          else
            npm publish --access public
          fi
      - name: Publish GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const fs=require("fs");const v=require("./package.json").version;const s=fs.readFileSync("CHANGELOG.md","utf8").split(`## [${v}]`)[1];fs.writeFileSync(process.env.RUNNER_TEMP+"/release-notes.md",s.slice(s.indexOf("\n")+1).split("\n## [")[0].trim())'
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME — SCORM Player" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/standalone/install.sh artifacts/standalone/SHA256SUMS artifacts/standalone/scormplayer-*-standalone.tar.gz artifacts/agent-plugins/scormplayer-*.zip --clobber
